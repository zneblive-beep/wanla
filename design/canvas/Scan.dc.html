<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สแกนสลิป</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.h{font-family:'Mitr','IBM Plex Sans Thai',sans-serif;font-weight:500}
.num{font-family:'Bricolage Grotesque','Mitr',sans-serif;font-weight:800;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cn{position:absolute;width:34px;height:34px;border-color:currentColor;border-style:solid;border-width:0}
.ln{display:flex;align-items:baseline;gap:8px;font-size:13px;padding:5px 0}
.ln .k{color:#5E5A52}
.ln .d{flex:1;border-bottom:2px dotted #CFC8B8;transform:translateY(-3px)}
.ln .v{font-weight:600}
@keyframes sweep{0%{top:12%}50%{top:84%}100%{top:12%}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#161616;font-family:'IBM Plex Sans Thai',sans-serif;color:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0">
    <a href="Add.dc.html" aria-label="ปิด" style="width:42px;height:42px;border-radius:50%;background:#2A2A27;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    <a href="Paywall.dc.html" style="display:flex;align-items:center;gap:6px;background:#2A2A27;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600">ฟรีเดือนนี้เหลือ <span class="num" style="color:{{brand}};font-size:14px">7/10</span> ใบ</a>
    <span style="width:42px;height:42px;border-radius:50%;background:#2A2A27;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 5 14h6l-1 7 8-11h-6z"/></svg></span>
  </div>

  <div style="position:relative;height:300px;margin:18px 40px 0;color:{{brand}}">
    <span class="cn" style="left:0;top:0;border-top-width:5px;border-left-width:5px;border-top-left-radius:14px"></span>
    <span class="cn" style="right:0;top:0;border-top-width:5px;border-right-width:5px;border-top-right-radius:14px"></span>
    <span class="cn" style="left:0;bottom:0;border-bottom-width:5px;border-left-width:5px;border-bottom-left-radius:14px"></span>
    <span class="cn" style="right:0;bottom:0;border-bottom-width:5px;border-right-width:5px;border-bottom-right-radius:14px"></span>
    <div style="position:absolute;left:46px;right:46px;top:26px;bottom:26px;background:#ECEAE4;border-radius:14px;transform:rotate(-4deg);padding:16px;box-sizing:border-box;color:#161616;display:flex;flex-direction:column;gap:9px;opacity:0.9">
      <div style="display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:50%;background:#3B8F6F"></span><span style="height:8px;width:70px;border-radius:4px;background:#C9C5BB"></span></div>
      <div style="font-size:11px;color:#6F6B62">โอนเงินสำเร็จ</div>
      <div class="num" style="font-size:26px">185.00</div>
      <span style="height:7px;width:80%;border-radius:4px;background:#D6D2C8"></span>
      <span style="height:7px;width:60%;border-radius:4px;background:#D6D2C8"></span>
      <span style="height:7px;width:70%;border-radius:4px;background:#D6D2C8"></span>
      <span style="margin-top:auto;width:52px;height:52px;border-radius:6px;background:repeating-conic-gradient(#161616 0 25%,#ECEAE4 0 50%) 0 0/13px 13px;align-self:flex-end"></span>
    </div>
    <div style="position:absolute;left:8px;right:8px;height:4px;border-radius:2px;background:currentColor;box-shadow:0 0 22px 6px currentColor;opacity:0.85;animation:sweep 2.6s ease-in-out infinite;top:40%"></div>
  </div>

  <div style="margin:22px 16px 0;height:14px;border-radius:8px;background:#2A2A27;border:2px solid #3A3A36"></div>
  <div style="margin:-6px 30px 0;filter:drop-shadow(0 10px 0 rgba(0,0,0,0.25))">
    <div style="background:#FFFFFF;color:#161616;padding:16px 18px 8px;position:relative">
      <span style="position:absolute;right:14px;top:12px;border:3px solid {{accent}};color:{{accent}};border-radius:10px;padding:2px 10px;font-weight:800;font-size:15px;transform:rotate(12deg);font-family:'Mitr',sans-serif">ไม่ซ้ำ ✓</span>
      <div class="h" style="font-size:17px">อ่านสลิปแล้ว</div>
      <div style="font-size:11px;color:#8A8577;margin-bottom:6px">ใช้เวลา 2 วินาที</div>
      <div class="ln"><span class="k">ร้าน</span><span class="d"></span><span class="v">คาเฟ่ริมทาง</span></div>
      <div class="ln"><span class="k">เมื่อ</span><span class="d"></span><span class="v">25 พ.ย. 69 · 14:32</span></div>
      <div class="ln"><span class="k">หมวด</span><span class="d"></span><span class="v" style="background:#FFB27A;border:2px solid #161616;border-radius:999px;padding:0 8px;font-size:12px">อาหาร · เดาจากชื่อร้าน</span></div>
      <div class="ln" style="padding-top:8px"><span class="k">ยอด</span><span class="d"></span><span class="num" style="font-size:30px">฿185.00</span></div>
    </div>
    <div style="height:9px;background:conic-gradient(from -45deg at 50% 100%,#FFFFFF 90deg,transparent 0) 0 0/16px 100%"></div>
  </div>

  <div style="margin-top:auto;display:flex;gap:12px;padding:0 20px 26px">
    <a href="Add.dc.html" style="flex:1;height:58px;border-radius:20px;border:2px solid #FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600">แก้ไข</a>
    <a href="Main.dc.html" style="flex:2;height:58px;border-radius:20px;background:{{brand}};color:#161616;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;border:2px solid #161616;box-shadow:4px 4px 0 #FFFFFF">บันทึกเลย</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#C6F432","options":["#C6F432","#FFD23F","#7CC4FF","#FF9EC7"]},"accent":{"editor":"color","default":"#FF5A36","options":["#FF5A36","#7B61FF","#161616"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { brand: this.props.brand ?? '#C6F432', accent: this.props.accent ?? '#FF5A36' };
  }
}
</script>
</body>
</html>
