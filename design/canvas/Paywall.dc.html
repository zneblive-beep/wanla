<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สายโปร</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.h{font-family:'Mitr','IBM Plex Sans Thai',sans-serif;font-weight:500}
.num{font-family:'Bricolage Grotesque','Mitr',sans-serif;font-weight:800;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.nb{border:2px solid #161616;border-radius:22px;box-shadow:4px 4px 0 #161616}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stk{display:inline-flex;align-items:center;gap:5px;border:2px solid #161616;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:#FFFFFF}
.ft{display:flex;align-items:center;gap:8px;background:#FFFFFF;border:2px solid #161616;border-radius:16px;padding:9px 10px;font-size:13px;font-weight:600}
.ft span{width:28px;height:28px;border-radius:9px;border:2px solid #161616;display:flex;align-items:center;justify-content:center;flex:none}
.tk{flex:1;position:relative;border:2px solid #161616;border-radius:20px;background:#FFFFFF;padding:16px 14px 14px;text-align:center}
.tk:before,.tk:after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#F7F1E3;border:2px solid #161616;transform:translateY(-50%)}
.tk:before{left:-11px;clip-path:inset(0 0 0 50%)}
.tk:after{right:-11px;clip-path:inset(0 50% 0 0)}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:{{brand}};font-family:'IBM Plex Sans Thai',sans-serif;color:#161616;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <div style="position:absolute;inset:0;background:radial-gradient(circle,rgba(22,22,22,0.14) 1.6px,transparent 2px) 0 0/22px 22px"></div>
  <div style="display:flex;justify-content:flex-end;padding:18px 20px 0;position:relative">
    <a href="Budgets.dc.html" aria-label="ปิด" style="width:42px;height:42px;border-radius:50%;border:2px solid #161616;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
  </div>

  <div style="position:relative;display:flex;justify-content:center;margin-top:-6px">
    <svg width="150" height="150" viewBox="0 0 100 100" aria-hidden="true" style="transform:rotate(-6deg)">
      <path d="M30 24 26 6l13 9 11-12 11 12 13-9-4 18z" fill="#FFD23F" stroke="#161616" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="39" cy="14" r="2.5" fill="{{accent}}"/><circle cx="50" cy="10" r="2.5" fill="#7CC4FF"/><circle cx="61" cy="14" r="2.5" fill="{{accent}}"/>
      <circle cx="50" cy="58" r="34" fill="#FFD23F" stroke="#161616" stroke-width="2.5"/>
      <circle cx="50" cy="58" r="26" fill="none" stroke="#161616" stroke-width="2" stroke-dasharray="3 4"/>
      <rect x="28" y="47" width="18" height="11" rx="5" fill="#161616"/><rect x="54" y="47" width="18" height="11" rx="5" fill="#161616"/><path d="M46 51h8" stroke="#161616" stroke-width="2.5"/>
      <path d="M38 68q12 10 24 0" fill="none" stroke="#161616" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M88 26l2 6 6 2-6 2-2 6-2-6-6-2 6-2zM12 70l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#FFFFFF" stroke="#161616" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1 class="h" style="margin:4px 24px 0;font-size:32px;line-height:1.2;text-align:center;position:relative">อัปเป็นสายโปร<br>เงินไม่หลุดมือ</h1>
  <p style="margin:8px 0 0;text-align:center;font-size:14px;position:relative">ลองฟรี [X] วัน ไม่ชอบยกเลิกได้ในแอปสโตร์</p>

  <div style="margin-top:auto;background:#F7F1E3;border-top:2px solid #161616;border-radius:32px 32px 0 0;padding:22px 20px 24px;position:relative;display:flex;flex-direction:column;gap:14px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="ft"><span style="background:{{brand}}"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg></span>สแกนสลิปไม่อั้น</div>
      <div class="ft"><span style="background:#FF9EC7"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg></span>หลายกระเป๋า</div>
      <div class="ft"><span style="background:#7CC4FF"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 0 1-.5-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg></span>ซิงค์ทุกเครื่อง</div>
      <div class="ft"><span style="background:#FFD23F"><svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/></svg></span>ส่งออก Excel/PDF</div>
    </div>

    <div style="display:flex;gap:14px;margin-top:6px">
      <div class="tk" style="box-shadow:5px 5px 0 #161616;border-width:3px;background:#FFFFFF">
        <span class="stk" style="position:absolute;top:-13px;left:50%;transform:translateX(-50%) rotate(-4deg);background:{{accent}};color:#FFFFFF;white-space:nowrap">คุ้มสุด</span>
        <div style="font-size:14px;font-weight:600">รายปี</div>
        <div class="num" style="font-size:26px;margin-top:2px">฿[ราคา]</div>
        <div style="font-size:11px;color:#5E5A52">ตกเดือนละ ฿[ราคา]</div>
      </div>
      <div class="tk">
        <div style="font-size:14px;font-weight:600">รายเดือน</div>
        <div class="num" style="font-size:26px;margin-top:2px">฿[ราคา]</div>
        <div style="font-size:11px;color:#5E5A52">ยกเลิกเมื่อไหร่ก็ได้</div>
      </div>
    </div>

    <a href="Main.dc.html" style="height:58px;border-radius:20px;background:#161616;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;margin-top:4px">เริ่มทดลองใช้ฟรี</a>
    <div style="display:flex;justify-content:center;gap:16px;font-size:12px;color:#5E5A52"><a href="Main.dc.html">กู้คืนการซื้อ</a><span>·</span><a href="Main.dc.html">เงื่อนไขการใช้งาน</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#C6F432","options":["#C6F432","#FFD23F","#7CC4FF","#FF9EC7"]},"accent":{"editor":"color","default":"#FF5A36","options":["#FF5A36","#7B61FF","#161616"]},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return { brand: this.props.brand ?? '#C6F432', accent: this.props.accent ?? '#FF5A36' };
  }
}
