<title>สมุดเงินรายวัน</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: passbook ledger. Phone = one column (summary, add, breakdown, list); desktop = two columns. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F5F8F6; --line:#D7DFDA;
  --ink:#15201C; --muted:#5B6A63; --accent:#1D6B58; --accent-ink:#FFFFFF;
  --income:#1B8152; --expense:#B93C28; --warn:#A86A00;
  --font-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --surface-2:#1C2723; --line:#2A3833;
  --ink:#E4ECE8; --muted:#94A49D; --accent:#5BC2A2; --accent-ink:#08201A;
  --income:#55C48D; --expense:#F07D66; --warn:#E3A93D; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --surface-2:#1C2723; --line:#2A3833;
  --ink:#E4ECE8; --muted:#94A49D; --accent:#5BC2A2; --accent-ink:#08201A;
  --income:#55C48D; --expense:#F07D66; --warn:#E3A93D; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.35rem;letter-spacing:.2px;margin:0}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:1.1rem;color:var(--muted)}
.month button:hover{background:var(--surface-2);color:var(--ink)}
.month span{min-width:9.5em;text-align:center;font-family:var(--font-display);font-weight:600}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.9rem}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

.grid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:900px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.label{font-size:.75rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
h2{font-family:var(--font-display);font-size:1.05rem;font-weight:600;margin:0 0 12px;text-wrap:balance}

/* passbook summary */
.book{background:var(--accent);color:var(--accent-ink);border:0;position:relative;overflow:hidden}
.book::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 27px,color-mix(in srgb,var(--accent-ink) 9%,transparent) 27px 28px);pointer-events:none}
.book .label{color:color-mix(in srgb,var(--accent-ink) 75%,transparent)}
.balance{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,7vw,2.6rem);line-height:1.1;margin:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;position:relative;z-index:1}
.split div{background:color-mix(in srgb,var(--accent-ink) 12%,transparent);border-radius:10px;padding:10px 12px}
.split b{display:block;font-family:var(--font-display);font-size:1.15rem}
.split span{font-size:.8rem;opacity:.85}

.budget-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--income);border-radius:99px;transition:width .4s}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--expense)}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.budget-edit{display:flex;gap:8px;margin-top:10px}
.budget-edit input{flex:1;min-width:0}

/* form */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.seg button[aria-pressed="true"][data-t="expense"]{color:var(--expense)}
.seg button[aria-pressed="true"][data-t="income"]{color:var(--income)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field label,.field legend{font-size:.85rem;color:var(--muted);padding:0}
input[type=text],input[type=number],input[type=date]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus{border-color:var(--accent);outline:none}
.amount{position:relative}
.amount input{font-family:var(--font-display);font-size:1.6rem;font-weight:600;padding-left:36px}
.amount::before{content:"฿";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:1.3rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
fieldset{border:0;margin:0 0 12px;padding:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.88rem}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);font-weight:600}
.actions{display:flex;gap:8px}
.primary{flex:1;border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:12px;font-weight:600;font-size:1rem}
.primary:hover{filter:brightness(1.07)}
.err{color:var(--expense);font-size:.85rem;margin:-4px 0 10px}

/* breakdown */
.cats{display:flex;flex-direction:column;gap:10px}
.cat-row{display:grid;grid-template-columns:7.5em 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.cat-row .track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.cat-row .track i{display:block;height:100%;border-radius:99px}
.cat-row .pct{color:var(--muted);font-size:.8rem;min-width:7.5em;text-align:right}

/* list */
.day{margin-top:14px}
.day:first-child{margin-top:0}
.day-head{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:4px;margin-bottom:4px}
.tx{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 6px;border-radius:8px}
.tx:hover{background:var(--surface-2)}
.tx .dot{width:10px;height:10px;border-radius:50%}
.tx .main{min-width:0;border:0;background:transparent;text-align:left;padding:0}
.tx .main b{display:block;font-weight:500}
.tx .main span{display:block;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-family:var(--font-display);font-weight:600}
.amt.income{color:var(--income)} .amt.expense{color:var(--expense)}
.del{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:4px 8px;font-size:.8rem}
.del:hover{border-color:var(--line)}
.del.confirm{background:var(--expense);color:#fff;border-color:var(--expense)}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted);font-weight:400}

.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty p{margin:0 0 12px}
.note{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
/* slip reader */
.slip{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:14px;background:var(--surface-2);cursor:pointer}
.slip:hover,.slip.drag{border-color:var(--accent)}
.slip .ic{flex:0 0 auto;width:40px;height:40px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.8rem}
.slip b{display:block;font-weight:600}
.slip span{display:block;font-size:.82rem;color:var(--muted)}
.slip-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.slip-result{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:14px;font-size:.88rem}
.slip-result img{width:64px;height:88px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto}
.slip-result .txt{min-width:0;flex:1}
.slip-result .txt p{margin:0 0 2px}
.slip-result .warn{color:var(--warn);font-weight:600}
.slip-result.busy .txt p:first-child::after{content:"";display:inline-block;width:.9em;height:.9em;margin-left:8px;vertical-align:-2px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">สมุดเงินรายวัน<small>จดรายรับรายจ่าย ดูว่าเงินไปไหน</small></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div class="month" role="group" aria-label="เลือกเดือน">
        <button id="prev" type="button" aria-label="เดือนก่อน">‹</button>
        <span id="monthLabel" class="num" aria-live="polite"></span>
        <button id="next" type="button" aria-label="เดือนถัดไป">›</button>
      </div>
      <button id="exportBtn" class="ghost" type="button" hidden>ส่งออก CSV</button>
    </div>
  </header>

  <div class="grid">
    <div class="col">
      <section class="panel book" aria-label="สรุปเดือนนี้">
        <p class="label">คงเหลือเดือนนี้</p>
        <p id="balance" class="balance num">฿0</p>
        <div class="split">
          <div><span>รายรับ</span><b id="incomeSum" class="num">฿0</b></div>
          <div><span>รายจ่าย</span><b id="expenseSum" class="num">฿0</b></div>
        </div>
      </section>

      <section class="panel" aria-labelledby="budgetH">
        <div class="budget-row">
          <h2 id="budgetH" style="margin:0">งบรายจ่ายต่อเดือน</h2>
          <button id="budgetToggle" class="ghost" type="button">ตั้งงบ</button>
        </div>
        <div id="budgetBody"></div>
        <form id="budgetForm" class="budget-edit" hidden>
          <input id="budgetInput" type="number" inputmode="decimal" min="0" step="1" placeholder="เช่น 15000" aria-label="งบรายจ่ายต่อเดือน (บาท)">
          <button class="primary" type="submit" style="flex:0 0 auto;padding:10px 16px">บันทึก</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="formH">
        <h2 id="formH">เพิ่มรายการ</h2>
        <label id="slipZone" class="slip" for="slipFile" hidden>
          <span class="ic" aria-hidden="true">สลิป</span>
          <span style="min-width:0"><b>อ่านจากสลิปโอนเงิน</b><span>เลือกรูปสลิป ลากมาวาง หรือวาง (Ctrl+V) แล้วแอปจะกรอกให้</span></span>
          <input id="slipFile" class="slip-file" type="file" accept="image/*">
        </label>
        <div id="slipResult" class="slip-result" hidden aria-live="polite"></div>
        <form id="txForm" novalidate>
          <div class="seg" role="group" aria-label="ประเภท">
            <button type="button" data-t="expense" aria-pressed="true">รายจ่าย</button>
            <button type="button" data-t="income" aria-pressed="false">รายรับ</button>
          </div>
          <div class="field">
            <label for="amount">จำนวนเงิน</label>
            <div class="amount"><input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" class="num"></div>
          </div>
          <fieldset>
            <legend>หมวดหมู่</legend>
            <div id="chips" class="chips"></div>
          </fieldset>
          <div class="two">
            <div class="field"><label for="date">วันที่</label><input id="date" type="date"></div>
            <div class="field"><label for="note">โน้ต (ไม่ใส่ก็ได้)</label><input id="note" type="text" maxlength="80" placeholder="เช่น ข้าวมันไก่"></div>
          </div>
          <p id="formErr" class="err" hidden></p>
          <div class="actions">
            <button id="submitBtn" class="primary" type="submit">บันทึกรายการ</button>
            <button id="cancelEdit" class="ghost" type="button" hidden>ยกเลิก</button>
          </div>
        </form>
      </section>
    </div>

    <div class="col">
      <section class="panel" aria-labelledby="catH">
        <h2 id="catH">รายจ่ายตามหมวด</h2>
        <div id="cats" class="cats"></div>
      </section>
      <section class="panel" aria-labelledby="listH">
        <div class="budget-row" style="margin-bottom:8px">
          <h2 id="listH" style="margin:0">รายการ</h2>
          <button id="clearSample" class="ghost" type="button" hidden>ลบข้อมูลตัวอย่าง</button>
        </div>
        <div id="list"></div>
      </section>
    </div>
  </div>
  <p id="modeNote" class="note">กำลังโหลด…</p>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
const CATS = {
  expense: [
    {id:'food',name:'อาหาร',c:'#E07A3F'},{id:'travel',name:'เดินทาง',c:'#3B82C4'},
    {id:'shop',name:'ช้อปปิ้ง',c:'#C2569B'},{id:'bill',name:'บิล ค่าน้ำไฟ',c:'#7A6BD1'},
    {id:'home',name:'ที่พัก',c:'#4E9A8A'},{id:'health',name:'สุขภาพ',c:'#D24B5A'},
    {id:'fun',name:'บันเทิง',c:'#C9A227'},{id:'other-e',name:'อื่นๆ',c:'#8A948F'}],
  income: [
    {id:'salary',name:'เงินเดือน',c:'#1B8152'},{id:'freelance',name:'ฟรีแลนซ์',c:'#2E9BB0'},
    {id:'sell',name:'ขายของ',c:'#8BA83A'},{id:'gift',name:'ของขวัญ',c:'#C2569B'},
    {id:'other-i',name:'อื่นๆ',c:'#8A948F'}]
};
const catOf = id => [...CATS.expense,...CATS.income].find(c=>c.id===id) || {name:'อื่นๆ',c:'#8A948F'};
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const parseD = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const money = n => '฿' + (Math.round(n*100)/100).toLocaleString('th-TH',{maximumFractionDigits:2});
const fmtMonth = new Intl.DateTimeFormat('th-TH',{month:'long',year:'numeric'});
const fmtDay = new Intl.DateTimeFormat('th-TH',{weekday:'short',day:'numeric',month:'short'});
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));

function el(tag, props, ...kids){
  const e=document.createElement(tag);
  if(props) for(const k in props){ if(k==='style') e.style.cssText=props[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),props[k]); else if(k in e && k!=='list') e[k]=props[k]; else e.setAttribute(k,props[k]); }
  for(const k of kids) if(k!=null) e.append(k);
  return e;
}

let state = { tx:[], budget:0, loaded:false };
let view = new Date(); view = new Date(view.getFullYear(), view.getMonth(), 1);
let form = { type:'expense', cat:'food', editId:null };
let pendingDel = null;
let store = null;

/* ---------- storage: private db per person, else this browser ---------- */
const LKEY='samud-ngern-v1';
function localStore(){
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(LKEY))||{tx:[],budget:0}; }catch(e){ return {tx:[],budget:0}; } };
  const write=d=>{ try{ localStorage.setItem(LKEY,JSON.stringify(d)); }catch(e){ toast('บันทึกในเบราว์เซอร์นี้ไม่ได้'); } };
  let d=read();
  const emit=()=>{ state.tx=d.tx.slice(); state.budget=d.budget||0; state.loaded=true; render(); };
  return {
    mode:'local', start(){ emit(); },
    async save(t){ const i=d.tx.findIndex(x=>x.id===t.id); if(i>=0) d.tx[i]=t; else d.tx.push(t); write(d); emit(); },
    async remove(id){ d.tx=d.tx.filter(x=>x.id!==id); write(d); emit(); },
    async setBudget(b){ d.budget=b; write(d); emit(); }
  };
}
function dbStore(db, uid){
  const col = db.collection('data/users/'+uid);
  return {
    mode:'db',
    start(){
      const timer=setTimeout(()=>{ if(!state.loaded){ $('modeNote').textContent='ยังเชื่อมต่อข้อมูลไม่ได้ ลองตรวจอินเทอร์เน็ต'; } },10000);
      col.onSnapshot(snap=>{
        if(!snap.metadata.fromCache) clearTimeout(timer);
        const tx=[]; let budget=0;
        for(const d of snap.docs){ const v=d.data(); if(d.id==='_settings') budget=Number(v.budget)||0; else tx.push(Object.assign({},v,{id:d.id})); }
        state.tx=tx; state.budget=budget; state.loaded=true; render();
      }, err=>{ clearTimeout(timer); $('modeNote').textContent='โหลดข้อมูลไม่สำเร็จ ('+err.code+') ลองเปิดหน้านี้ใหม่'; });
    },
    async save(t){ const {id,...body}=t; await col.doc(id).set(body); },
    async remove(id){ await col.doc(id).delete(); },
    async setBudget(b){ await col.doc('_settings').set({budget:b}); }
  };
}

/* ---------- render ---------- */
function ym(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthTx(){ const k=ym(view); return state.tx.filter(t=>t.date && t.date.startsWith(k)); }

function render(){
  $('monthLabel').textContent = fmtMonth.format(view);
  const list = monthTx();
  let inc=0, exp=0; for(const t of list){ if(t.type==='income') inc+=t.amount; else exp+=t.amount; }
  $('balance').textContent = (inc-exp<0?'−':'') + money(Math.abs(inc-exp));
  $('incomeSum').textContent = money(inc);
  $('expenseSum').textContent = money(exp);
  renderBudget(exp); renderCats(list, exp); renderList(list);
  $('clearSample').hidden = !state.tx.some(t=>t.sample);
  if(state.loaded) $('modeNote').textContent = store && store.mode==='db'
    ? 'ข้อมูลบันทึกไว้ในบัญชี Claude ของคุณ เห็นได้เฉพาะคุณ เปิดจากเครื่องไหนก็เจอ'
    : 'ข้อมูลบันทึกไว้ในเบราว์เซอร์นี้เท่านั้น ถ้าล้างข้อมูลเว็บจะหายไป';
}

function renderBudget(exp){
  const box=$('budgetBody'); box.replaceChildren();
  $('budgetToggle').textContent = state.budget ? 'แก้งบ' : 'ตั้งงบ';
  if(!state.budget){ box.append(el('p',{className:'hint',style:'margin-top:8px'},'ตั้งงบรายจ่ายไว้ แล้วแอปจะบอกว่าเหลือใช้ได้วันละเท่าไร')); return; }
  const pct = exp/state.budget*100;
  const i = el('i',{className: pct>100?'over':pct>80?'warn':'' , style:'width:'+Math.min(pct,100)+'%'});
  const now=new Date(); const isCur = ym(now)===ym(view);
  const daysInMonth = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
  const left = state.budget-exp;
  let hint;
  if(left<0) hint='เกินงบไปแล้ว '+money(-left);
  else if(isCur){ const daysLeft=daysInMonth-now.getDate()+1; hint='เหลือ '+money(left)+' · ใช้ได้วันละ '+money(left/daysLeft)+' อีก '+daysLeft+' วัน'; }
  else hint='เหลือ '+money(left)+' จากงบ '+money(state.budget);
  box.append(
    el('div',{className:'bar',role:'progressbar','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':String(Math.round(pct)),'aria-label':'ใช้งบไปแล้ว'},i),
    el('div',{className:'budget-row'},
      el('span',{className:'num'},'ใช้ไป '+money(exp)+' / '+money(state.budget)),
      el('span',{className:'num',style:'color:var(--muted);font-size:.85rem'},Math.round(pct)+'%')),
    el('p',{className:'hint num'},hint));
}

function renderCats(list, exp){
  const box=$('cats'); box.replaceChildren();
  const sums={}; for(const t of list) if(t.type==='expense') sums[t.cat]=(sums[t.cat]||0)+t.amount;
  const rows=Object.entries(sums).sort((a,b)=>b[1]-a[1]);
  if(!rows.length){ box.append(el('p',{className:'hint'},'ยังไม่มีรายจ่ายในเดือนนี้')); return; }
  const max=rows[0][1];
  for(const [id,v] of rows){ const c=catOf(id);
    box.append(el('div',{className:'cat-row'},
      el('span',null,c.name),
      el('div',{className:'track'},el('i',{style:'width:'+(v/max*100)+'%;background:'+c.c})),
      el('span',{className:'pct num'},money(v)+' · '+Math.round(v/exp*100)+'%')));
  }
}

function renderList(list){
  const box=$('list'); box.replaceChildren();
  if(!state.loaded){ box.append(el('div',{className:'empty'},el('p',null,'กำลังโหลดรายการ…'))); return; }
  if(!list.length){
    const e=el('div',{className:'empty'},el('p',null, state.tx.length ? 'เดือนนี้ยังไม่มีรายการ' : 'ยังไม่มีรายการ เริ่มจดรายการแรกจากช่องเพิ่มรายการ'));
    if(!state.tx.length) e.append(el('button',{className:'ghost',type:'button',onclick:addSamples},'ลองใส่ข้อมูลตัวอย่าง'));
    box.append(e); return;
  }
  const sorted=list.slice().sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  const groups={}; for(const t of sorted)(groups[t.date]=groups[t.date]||[]).push(t);
  for(const date of Object.keys(groups)){
    const items=groups[date]; let net=0; for(const t of items) net+= t.type==='income'?t.amount:-t.amount;
    const day=el('div',{className:'day'}, el('div',{className:'day-head'}, el('span',null,fmtDay.format(parseD(date))), el('span',{className:'num'},(net<0?'−':'+')+money(Math.abs(net)))));
    for(const t of items){ const c=catOf(t.cat);
      const del=el('button',{className:'del'+(pendingDel===t.id?' confirm':''),type:'button','aria-label':'ลบรายการ '+c.name}, pendingDel===t.id?'ยืนยันลบ':'ลบ');
      del.addEventListener('click',()=>onDelete(t.id));
      const title=el('b',null,c.name); if(t.sample) title.append(el('span',{className:'tag'},'ตัวอย่าง'));
      day.append(el('div',{className:'tx'},
        el('span',{className:'dot',style:'background:'+c.c}),
        el('button',{className:'main',type:'button','aria-label':'แก้ไขรายการ '+c.name,onclick:()=>startEdit(t)}, title, t.note?el('span',null,t.note):null),
        el('span',{className:'amt num '+t.type},(t.type==='income'?'+':'−')+money(t.amount)),
        del));
    }
    box.append(day);
  }
}

/* ---------- form ---------- */
function renderChips(){
  const box=$('chips'); box.replaceChildren();
  for(const c of CATS[form.type]){
    box.append(el('button',{className:'chip',type:'button','aria-pressed':String(form.cat===c.id),onclick:()=>{form.cat=c.id;renderChips();}},
      el('span',{className:'dot',style:'background:'+c.c}), c.name));
  }
}
function setType(t){
  form.type=t;
  if(!CATS[t].some(c=>c.id===form.cat)) form.cat=CATS[t][0].id;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t)));
  renderChips();
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.t)));

function resetForm(){
  form.editId=null; form.slipRef=null; clearSlip(); $('amount').value=''; $('note').value=''; $('date').value=todayStr();
  $('submitBtn').textContent='บันทึกรายการ'; $('cancelEdit').hidden=true; $('formH').textContent='เพิ่มรายการ'; $('formErr').hidden=true;
}
function startEdit(t){
  form.editId=t.id; setType(t.type); form.cat=t.cat; renderChips();
  $('amount').value=t.amount; $('note').value=t.note||''; $('date').value=t.date;
  $('submitBtn').textContent='บันทึกการแก้ไข'; $('cancelEdit').hidden=false; $('formH').textContent='แก้ไขรายการ';
  $('formH').scrollIntoView({behavior:'smooth',block:'start'}); $('amount').focus({preventScroll:true});
}
$('cancelEdit').addEventListener('click',resetForm);

$('txForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const amount=Math.round(parseFloat($('amount').value)*100)/100;
  const date=$('date').value;
  const err=$('formErr');
  if(!(amount>0)){ err.textContent='ใส่จำนวนเงินที่มากกว่า 0'; err.hidden=false; $('amount').focus(); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ err.textContent='เลือกวันที่ของรายการ'; err.hidden=false; $('date').focus(); return; }
  err.hidden=true;
  const old = form.editId && state.tx.find(t=>t.id===form.editId);
  const t={ id: form.editId||newId(), type:form.type, amount, cat:form.cat, note:$('note').value.trim(), date, createdAt: old?old.createdAt:Date.now() };
  const ref = form.slipRef || (old && old.ref); if(ref) t.ref=ref;
  const wasEdit=!!form.editId;
  try{ await store.save(t); }catch(x){ toast(x&&x.code==='quota_exceeded'?'พื้นที่เก็บข้อมูลเต็ม ลบรายการเก่าบางส่วนก่อน':'บันทึกไม่สำเร็จ ลองอีกครั้ง'); return; }
  const d=parseD(date); if(ym(d)!==ym(view)){ view=new Date(d.getFullYear(),d.getMonth(),1); render(); }
  resetForm(); toast(wasEdit?'แก้ไขแล้ว':'บันทึกแล้ว '+(t.type==='income'?'+':'−')+money(amount));
});

async function onDelete(id){
  if(pendingDel!==id){ pendingDel=id; render(); setTimeout(()=>{ if(pendingDel===id){ pendingDel=null; render(); } },4000); return; }
  pendingDel=null;
  try{ await store.remove(id); toast('ลบแล้ว'); if(form.editId===id) resetForm(); }catch(x){ toast('ลบไม่สำเร็จ ลองอีกครั้ง'); render(); }
}

/* budget */
$('budgetToggle').addEventListener('click',()=>{ const f=$('budgetForm'); f.hidden=!f.hidden; if(!f.hidden){ $('budgetInput').value=state.budget||''; $('budgetInput').focus(); } });
$('budgetForm').addEventListener('submit',async e=>{
  e.preventDefault(); const b=Math.max(0,Math.round(parseFloat($('budgetInput').value)||0));
  try{ await store.setBudget(b); $('budgetForm').hidden=true; toast(b?'ตั้งงบ '+money(b)+' แล้ว':'ล้างงบแล้ว'); }catch(x){ toast('บันทึกงบไม่สำเร็จ'); }
});

/* month nav */
$('prev').addEventListener('click',()=>{ view=new Date(view.getFullYear(),view.getMonth()-1,1); render(); });
$('next').addEventListener('click',()=>{ view=new Date(view.getFullYear(),view.getMonth()+1,1); render(); });

/* samples */
async function addSamples(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth(), td=now.getDate();
  const day=k=>{ const d=Math.max(1,td-k); return y+'-'+pad(m+1)+'-'+pad(d); };
  const rows=[
    ['income','salary',25000,'เงินเดือน',td-1],['expense','home',6500,'ค่าห้อง',td-1],
    ['expense','bill',890,'ค่าไฟ',4],['expense','food',65,'ข้าวมันไก่',0],['expense','food',45,'ชาเย็น',0],
    ['expense','travel',42,'BTS',1],['expense','shop',590,'เสื้อยืด',2],['income','freelance',3000,'ออกแบบโลโก้',3],
    ['expense','fun',220,'ดูหนัง',3],['expense','food',180,'ข้าวเย็นกับเพื่อน',2]];
  try{ for(const [type,cat,amount,note,k] of rows) await store.save({id:newId(),type,cat,amount,note,date:day(k),createdAt:Date.now(),sample:true}); toast('ใส่ข้อมูลตัวอย่างแล้ว'); }
  catch(x){ toast('ใส่ข้อมูลตัวอย่างไม่สำเร็จ'); }
}
$('clearSample').addEventListener('click',async()=>{
  try{ for(const t of state.tx.filter(t=>t.sample)) await store.remove(t.id); toast('ลบข้อมูลตัวอย่างแล้ว'); }catch(x){ toast('ลบไม่สำเร็จ'); }
});

/* export */
async function setupExport(dl){
  if(!dl) return;
  const btn=$('exportBtn'); btn.hidden=false;
  btn.addEventListener('click',async()=>{
    const list=monthTx().sort((a,b)=>a.date.localeCompare(b.date));
    if(!list.length){ toast('เดือนนี้ยังไม่มีรายการให้ส่งออก'); return; }
    const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
    const lines=['วันที่,ประเภท,หมวดหมู่,จำนวนเงิน,โน้ต', ...list.map(t=>[t.date, t.type==='income'?'รายรับ':'รายจ่าย', catOf(t.cat).name, (t.type==='income'?1:-1)*t.amount, t.note||''].map(q).join(','))];
    try{ await dl.save({filename:'samud-ngern-'+ym(view)+'.csv', data:new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'})}); }
    catch(x){ toast('ไม่ได้บันทึกไฟล์'); }
  });
}

/* ---------- slip reader ---------- */
let sampler=null, slipUrl=null, slipBusy=false;
function clearSlip(){ const r=$('slipResult'); r.hidden=true; r.replaceChildren(); r.classList.remove('busy'); if(slipUrl){ URL.revokeObjectURL(slipUrl); slipUrl=null; } }
function slipMsg(lines, busy){
  const r=$('slipResult'); r.replaceChildren(); r.hidden=false; r.classList.toggle('busy',!!busy);
  if(slipUrl) r.append(el('img',{src:slipUrl,alt:'รูปสลิปที่เลือก'}));
  const txt=el('div',{className:'txt'});
  for(const l of lines) txt.append(typeof l==='string'?el('p',null,l):l);
  r.append(txt);
}
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);
    const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',0.88));
  }catch(e){ return file; }
}
const SLIP_PROMPT = `The image should be a Thai bank or e-wallet transfer slip (e.g. K PLUS, SCB EASY, Krungthai NEXT, Bangkok Bank, PromptPay, TrueMoney).
Read it and reply with only one JSON object:
{"is_slip": true, "amount": 125.50, "date": "2026-11-24", "time": "14:32", "from_name": "...", "to_name": "...", "bank": "...", "ref": "...", "memo": "...", "category": "food"}
Rules:
- amount: the transferred amount as a number in baht, without fees.
- date: convert to the Gregorian calendar as YYYY-MM-DD. Thai slips usually show the Buddhist year (2569 = 2026, or short "69" = 2026) and Thai month abbreviations (ม.ค. ก.พ. มี.ค. เม.ย. พ.ค. มิ.ย. ก.ค. ส.ค. ก.ย. ต.ค. พ.ย. ธ.ค.).
- ref: the transaction reference number exactly as printed, or "" if none.
- to_name / from_name: as printed (keep Thai). memo: the note on the slip, or "".
- category: guess what the payment was for from the receiver and memo; one of: food, travel, shop, bill, home, health, fun, other-e.
- If the image is not a transfer slip, reply {"is_slip": false}. Use null for any field you cannot read. Never guess an amount.`;

async function readSlip(file){
  if(!sampler || slipBusy) return;
  if(!file || !/^image\//.test(file.type)){ toast('เลือกไฟล์รูปภาพของสลิป'); return; }
  if(form.editId) resetForm();
  slipBusy=true; clearSlip(); slipUrl=URL.createObjectURL(file);
  slipMsg(['กำลังอ่านสลิป…','ปกติใช้เวลาไม่กี่วินาที'],true);
  try{
    const img=await shrink(file);
    const r=await sampler.json(SLIP_PROMPT,{images:[img]});
    if(!r || r.is_slip===false){ slipMsg([el('p',{className:'warn'},'รูปนี้ไม่น่าใช่สลิปโอนเงิน'),'ลองรูปอื่น หรือกรอกเองด้านล่าง']); return; }
    const amount=Number(r.amount);
    setType('expense');
    if(r.category && CATS.expense.some(c=>c.id===r.category)){ form.cat=r.category; renderChips(); }
    if(amount>0) $('amount').value=Math.round(amount*100)/100;
    if(typeof r.date==='string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) $('date').value=r.date;
    const who=[r.to_name,r.memo].filter(x=>typeof x==='string'&&x.trim()).join(' · ');
    if(who) $('note').value=who.slice(0,80);
    form.slipRef = (typeof r.ref==='string' && r.ref.trim()) ? r.ref.trim().slice(0,60) : null;
    const lines=[el('p',null,el('b',null,amount>0?'อ่านได้ '+money(amount):'อ่านจำนวนเงินไม่ได้ กรอกเองด้านล่าง'))];
    const meta=[r.bank, r.date && r.time ? r.date+' '+r.time : r.date, r.to_name?'ถึง '+r.to_name:null].filter(x=>typeof x==='string'&&x);
    if(meta.length) lines.push(meta.join(' · '));
    const dup = form.slipRef && state.tx.find(t=>t.ref===form.slipRef);
    if(dup) lines.push(el('p',{className:'warn'},'สลิปนี้เคยบันทึกแล้วเมื่อ '+fmtDay.format(parseD(dup.date))+' ระวังบันทึกซ้ำ'));
    lines.push('ตรวจหมวดและตัวเลข ถ้าเป็นเงินเข้าให้เปลี่ยนเป็นรายรับ แล้วกดบันทึก');
    slipMsg(lines);
    $('amount').focus({preventScroll:true});
  }catch(e){
    const m = e&&e.code==='not_granted' ? 'ต้องอนุญาตให้หน้านี้ส่งรูปให้ Claude อ่านก่อน'
      : e&&e.code==='rate_limited' ? 'ใช้งานถี่เกินไป รอสักครู่แล้วลองใหม่'
      : e&&e.code==='image_rejected' ? 'เปิดรูปนี้ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG'
      : 'อ่านสลิปไม่สำเร็จ ลองอีกครั้ง หรือกรอกเองด้านล่าง';
    slipMsg([el('p',{className:'warn'},m)]);
  }finally{ slipBusy=false; $('slipFile').value=''; }
}
async function setupSlip(s){
  if(!s) return;
  let caps=null; try{ caps=await s.limits(); }catch(e){}
  if(!caps || !caps.images) return;
  sampler=s;
  const zone=$('slipZone'); zone.hidden=false;
  $('slipFile').accept=caps.images.mediaTypes.join(',');
  $('slipFile').addEventListener('change',e=>readSlip(e.target.files[0]));
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('drag');readSlip(e.dataTransfer.files[0]);});
  document.addEventListener('paste',e=>{ const f=[...(e.clipboardData?.files||[])].find(f=>/^image\//.test(f.type)); if(f){ e.preventDefault(); readSlip(f); } });
}

let toastT;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

/* boot */
setType('expense'); resetForm(); render();
(async()=>{
  let db=null,user=null,dl=null,smp=null,uid=null;
  try{ if(window.claude && window.claude.use){ [db,user,dl,smp]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads'),claude.use('sample')]); } }catch(e){}
  setupSlip(smp);
  try{ uid = user ? await user.id() : null; }catch(e){}
  store = (db && uid) ? dbStore(db,uid) : localStore();
  store.start();
  setupExport(dl);
})();
})();
